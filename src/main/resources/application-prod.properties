# Production profile — activate with: --spring.profiles.active=prod
# Requires env vars: DB_USERNAME, DB_PASSWORD (DB_HOST defaults to localhost on current server)
# Step 2: externalize remaining secrets; consider requiring LEX_BOT_ID / LEX_BOT_ALIAS_ID via env

# Database — GFT DB EC2; override DB_HOST via env if needed
spring.datasource.url=jdbc:mysql://${DB_HOST:10.0.130.125}:3306/m3bot_prod
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA — keep update until MySQL migration is stable; then consider validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.output.ansi.enabled=false
openai.response.include-sanitization-debug=false

# Actuator — health (+ probes) for ALB; prometheus authenticated / not ALB-public (P0 #14 / #20 / #21)
# ALB target-group health check: GET /actuator/health/readiness → 200
# Prometheus scrape must supply Spring auth; network isolation alone is not enough
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true

# Internal services (same Application EC2 — localhost HTTP)
python-rag.api.base-url=http://localhost:8083
# Required in prod — do not inherit a hardcoded base key
python-rag.api.key=${RAG_INTERNAL_API_KEY}
python-rag.api.key.header=x-api-key
# Required in prod — do not inherit a hardcoded base key
presidio.api.key=${PRESIDIO_API_KEY}
presidio.analyzer.url=http://localhost:8000/api/v1/analyze
presidio.anonymizer.url=http://localhost:8000/api/v1/anonymize

# AWS services
# Comprehend region (Ireland)
aws.region=eu-west-1
comprehend.anonymization.enabled=true
# Explicit AWS SDK v2 timeouts (override SDK defaults) — attempt < call
aws.comprehend.api-call-timeout-ms=15000
aws.comprehend.api-call-attempt-timeout-ms=10000
aws.comprehend.connection-timeout-ms=5000

lex.enabled=true
# Lex Runtime V2 region (Ireland) — bot/alias must exist in eu-west-1
lex.region=eu-west-1
lex.bot-id=${LEX_BOT_ID:GUFEWREIRP}
lex.bot-alias-id=${LEX_BOT_ALIAS_ID:TSTALIASID}
lex.locale-id=en_US
aws.lex.api-call-timeout-ms=15000
aws.lex.api-call-attempt-timeout-ms=10000
aws.lex.connection-timeout-ms=5000

# Cognito JWT validation (M2M)
aws.cognito.region=eu-central-1
aws.cognito.required-scope=default-m2m-resource-server-5kguh6/read
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_j7SMcRyWv

# Enable when ALB terminates TLS in front of Spring
# server.forward-headers-strategy=framework
