spring.datasource.url=jdbc:mysql://localhost:3306/openaichatprocessdb?createDatabaseIfNotExists=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# DB is now used for chat session/message persistence.
# Keep MySQL running before app startup.

# Run on a non-default port to avoid conflicts.
server.port=8081

# OpenAI configuration
# Prefer using an environment variable for the API key in real environments.
# Default to empty so the app can start without a key (endpoints that call OpenAI will fail until set).
openai.api.key=${OPENAI_API_KEY}
# Do not put quotes around the key - Spring would include them and OpenAI returns 401
openai.api.model=gpt-5.6-terra
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.timeout-ms=120000
# GPT-5.6 family: use max_completion_tokens + reasoning_effort (ignored for gpt-4.x)
openai.api.reasoning-effort=none
openai.api.max-completion-tokens=4096
# Revert to gpt-4.1 on main/production: openai.api.model=gpt-4.1
openai.assistant.system-prompt.enabled=true
openai.assistant.system-prompt=You are the M3 AI Assistant for Infor M3 / CloudSuite. Never identify as ChatGPT or a generic AI. Apply CLEAR strictly. C - Context: No retrieved documentation is available in this path. Use reliable general Infor M3 / CloudSuite knowledge. Use conversation history only to understand the current question, not as authoritative documentation. L - Logic: Determine whether the question is related to Infor M3 / CloudSuite. For M3-related questions, answer using reliable general M3 knowledge when documentation is unavailable, including general M3 questions and external technologies connected to M3 such as AWS, Azure, or Kubernetes. For unrelated questions, do not answer the external topic; politely redirect to M3 / CloudSuite. Do not invent facts, program IDs, MI names, procedures, citations, or URLs. Do not present general knowledge as documentation-backed. State uncertainty when needed. For greetings, respond briefly as the M3 AI Assistant. For identity/name questions, identify yourself as the M3 AI Assistant. E - Expectations: Answer only what the user asks. Follow explicit constraints such as word count, length, format, and number of items. Match response length to the question; keep greetings and identity questions to 1-3 sentences. Do not provide a broad capability list unless requested. Ask for clarification when an M3 question is ambiguous. A - Actor: Experienced Infor M3 / CloudSuite consultant across Finance, Manufacturing, Supply Chain, Procurement, Sales, and Localization. R - References: Prefer official Infor sources, especially docs.infor.com, when useful. Never fabricate citations or URLs. If no verified reference is available, do not invent one. Do not expose anonymization placeholders.
openai.input.remove-anonymization-placeholders=true
openai.response.include-sanitization-debug=true

# Python RAG API Configuration
# Set to false to disable the Python RAG API and use OpenAI directly
python-rag.api.enabled=true
# Base URL of the Python RAG FastAPI service
python-rag.api.base-url=http://localhost:8083
# Endpoint path for the query operation
python-rag.api.endpoint=/chat
python-rag.api.retrieval-endpoint=/retrieval
python-rag.api.route-endpoint=/route
# HTTP request timeout in milliseconds (retrieval can take 15-30s with embeddings)
python-rag.api.timeout-ms=180000
# Query rewrite: false = rewrite OFF (maps to skip_rewrite=true on Python /retrieval)
rag.query-rewrite.enabled=true
# Default parameters for RAG queries
python-rag.api.top-k=5
python-rag.api.final-limit=8
rag.accept-threshold=0.30
rag.prompt-threshold=0.45
rag.partial.gap-fill.enabled=true
rag.program.boost=0.08

presidio.enabled=true
presidio.api.key=secret123
presidio.api.key.header=x-api-key
presidio.analyzer.url=http://localhost:8000/api/v1/analyze
presidio.anonymizer.url=http://localhost:8000/api/v1/anonymize
presidio.api.timeout-ms=15000

# Business information protection (LLM-bound only; Live/Lex bypass). Keep false until QA.
# Phase 7A: temporary PII→Business at OpenAI egress — not the target end-state (see Decision #20).
business-information.protection.enabled=true

# Comprehend anonymization configuration
# Enable/disable Comprehend-based PII detection and anonymization
comprehend.anonymization.enabled=true
# AWS Region for Comprehend service
aws.region=ap-south-1

# Amazon Lex V2 (live branch) — bot hosted in Europe (Frankfurt)
lex.enabled=true
lex.region=eu-central-1
# Override via env: LEX_BOT_ID, LEX_BOT_ALIAS_ID
lex.bot-id=${LEX_BOT_ID:GUFEWREIRP}
lex.bot-alias-id=${LEX_BOT_ALIAS_ID:TSTALIASID}
lex.locale-id=en_US
python-rag.api.m3-execute-endpoint=/m3/execute
python-rag.api.m3-call-endpoint=/m3/call
m3.execution.enabled=false
m3.execution.company=100
m3.execution.max-records=50
m3.search-context.ttl-seconds=3600
guided-search.ttl-seconds=3600
chat.session.default-token-limit=200000
chat.session.max-requests=50
chat.history.load-from-db=true
chat.history.max-exchanges=10
chat.history.max-user-questions=5
chat.history.allow-client-history=true
tenant.quota.default-base-limit=200000
tenant.quota.monthly-reset.cron=0 0 0 1 * *
tenant.quota.max-topup-tokens=500000
tenant.quota.timezone=UTC
suggestion.rule.enabled=true
suggestion.llm.enabled=true
suggestion.min-count=3
suggestion.max-count=5
suggestion.cache.ttl-seconds=900
suggestion.cache.max-entries=1000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

